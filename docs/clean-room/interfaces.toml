schema_version = 1
license = "MIT OR Apache-2.0"
methodology = "docs/clean-room/methodology.md"
toolchain_lock = "docs/external-inputs.md"

[[interface_set]]
id = "bootstrap-system"
compiler = "GNAT-FSF 15.3.0"
architectures = ["x86_64-elf", "aarch64-elf"]
record = "docs/clean-room/bootstrap-minimum-compiler-interface.md"
probe = "scripts/verify-bootstrap-minimum.sh"
implementation = "src/bootstrap"
gate = "scripts/verify-bootstrap-minimum.sh"
status = "historical"
claims = ["shape", "implementation"]
proof_scope = "none"

[[interface_set]]
id = "binder-bootstrap"
compiler = "GNAT-FSF 15.3.0"
architectures = ["x86_64-elf", "aarch64-elf"]
record = "docs/clean-room/bootstrap-elaboration-interface.md"
probe = "scripts/verify-bootstrap.sh"
implementation = "src/bootstrap"
gate = "scripts/verify-bootstrap.sh"
status = "supported"
claims = ["shape", "implementation", "semantics"]
proof_scope = "none"

[[interface_set]]
id = "tasking-lifecycle"
compiler = "GNAT-FSF 15.3.0"
architectures = ["x86_64-elf", "aarch64-elf"]
record = "docs/clean-room/tasking-compiler-interface.md"
probe = "scripts/probe-tasking-interface.sh"
implementation = "src/gnarl"
gate = "scripts/verify-tasking.sh"
status = "bounded"
claims = ["shape", "implementation", "semantics", "proof"]
proof_scope = "deterministic core models only; excludes Task_Core, the compiler facade, C, and assembly"

[[interface_set]]
id = "tasking-synchronization-and-exceptions"
compiler = "GNAT-FSF 15.3.0"
architectures = ["x86_64-elf", "aarch64-elf"]
record = "docs/clean-room/synchronization-compiler-interface.md"
probe = "scripts/probe-synchronization-interface.sh"
implementation = "src/gnarl"
gate = "scripts/verify-synchronization.sh"
status = "bounded"
claims = ["shape", "implementation", "semantics", "proof"]
proof_scope = "deterministic synchronization, clock, allocator, queue, and arbitration kernels only; excludes Task_Core, the compiler facade, C, and assembly"

[[interface_set]]
id = "dispatching-policy"
compiler = "GNAT-FSF 15.3.0"
architectures = ["x86_64-elf", "aarch64-elf"]
record = "docs/clean-room/preemption-policy-interface.md"
probe = "scripts/probe-preemption-policy.sh"
implementation = "src/gnarl"
gate = "scripts/verify-preemption.sh"
status = "supported"
claims = ["shape", "implementation", "semantics", "proof"]
proof_scope = "deterministic scheduling and preemption models only; excludes the concurrent wrapper and interrupt assembly"

[[interface_set]]
id = "dispatching-domains"
compiler = "GNAT-FSF 15.3.0"
architectures = ["x86_64-elf", "aarch64-elf"]
record = "docs/clean-room/dispatching-domain-interface.md"
probe = "scripts/probe-domain-interface.sh"
implementation = "src/gnarl"
gate = "scripts/verify-domains.sh"
status = "bounded"
claims = ["shape", "implementation", "semantics", "proof"]
proof_scope = "deterministic domain model only; excludes the concurrent wrapper and platform code"
